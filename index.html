function imp(){const f=$('#f').files[0];if(!f)return alert('파일을 선택하세요');const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
 const g=(r,...k)=>{for(const x of k)for(const y in r)if(y.trim().toLowerCase()==x)return r[y];return''};
 let id=Math.max(0,...S.items.map(i=>i.id))+1;
 const add=rows.filter(r=>g(r,'단어','word')).map(r=>mkItem({word:String(g(r,'단어','word')).trim(),pos:g(r,'품사','pos'),meaning:String(g(r,'뜻','meaning')),syn:g(r,'유의어','synonyms'),ant:g(r,'반의어','antonyms'),ch:String(g(r,'챕터','chapter'))},id++));
 if($('#rep').checked)S.items=add;else{const ex=new Set(S.items.map(i=>i.word.toLowerCase()));S.items.push(...add.filter(a=>!ex.has(a.word.toLowerCase())))}
 save();alert(add.length+'개 처리 완료');go('data')}catch(x){alert('읽기 실패: '+x.message)}};r.readAsArrayBuffer(f)}
function tpl(){const ws=XLSX.utils.json_to_sheet(S.items.map(i=>({단어:i.word,품사:i.pos,뜻:i.meaning,유의어:i.syn.join(', '),반의어:i.ant.join(', '),챕터:i.ch})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'vocab');XLSX.writeFile(wb,'vocab.xlsx')}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='vocalab-backup.json';a.click()}
nav();home();
</script></body></html>
